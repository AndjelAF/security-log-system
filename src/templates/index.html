<!DOCTYPE html>
<html>

<head>
    <title>Security Log Dashboard</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
        }

        h1 {
            text-align: center;
            margin-bottom: 40px;
            color: #1f2937;
            font-size: 36px;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 20px;
            color: #1f2937;
            font-size: 22px;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 35px;
        }

        .summary-card {
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0px 3px 12px rgba(0,0,0,0.08);
            transition: 0.2s ease;
        }

        .summary-card:hover {
            transform: translateY(-3px);
        }

        .summary-title {
            font-size: 15px;
            color: #666;
            margin-bottom: 10px;
        }

        .summary-value {
            font-size: 34px;
            font-weight: bold;
            color: #111827;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 25px;
        }

        .section {
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0px 3px 12px rgba(0,0,0,0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background-color: #1f2937;
            color: white;
            padding: 12px;
            text-align: left;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #e5e7eb;
        }

        tr:hover {
            background-color: #f9fafb;
        }

        .alert {
            background-color: #fff1f2;
            border-left: 5px solid #dc2626;
            color: #991b1b;
            padding: 14px;
            margin-bottom: 12px;
            border-radius: 8px;
            font-weight: bold;
        }

        .badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            color: white;
        }

        .risk-high {
            background-color: #dc2626;
        }

        .risk-medium {
            background-color: #f59e0b;
        }

        .risk-low {
            background-color: #16a34a;
        }

        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

    </style>
</head>

<body>

    <h1>Security Monitoring Dashboard</h1>


    <!-- SUMMARY CARDS -->

    <div class="summary-grid">

        <div class="summary-card">
            <div class="summary-title">Total Events</div>
            <div class="summary-value" id="totalEvents">0</div>
        </div>

        <div class="summary-card">
            <div class="summary-title">Failed Logins</div>
            <div class="summary-value" id="failedLogins">0</div>
        </div>

        <div class="summary-card">
            <div class="summary-title">High Risk Users</div>
            <div class="summary-value" id="highRiskUsers">0</div>
        </div>

    </div>



    <!-- DASHBOARD GRID -->

    <div class="dashboard-grid">

        <!-- EVENTS BY TYPE -->

        <div class="section">

            <h2>Događaji po tipu</h2>

            <table id="typesTable">

                <tr>
                    <th>Tip</th>
                    <th>Broj</th>
                </tr>

            </table>

        </div>



        <!-- TREND -->

        <div class="section">

            <h2>Activity Trend</h2>

            <table id="trendTable">

                <tr>
                    <th>Time Window</th>
                    <th>Events</th>
                </tr>

            </table>

        </div>



        <!-- USER ALERTS -->

        <div class="section">

            <h2>Brute Force - Username</h2>

            <div id="userAlerts"></div>

        </div>



        <!-- IP ALERTS -->

        <div class="section">

            <h2>Brute Force - IP</h2>

            <div id="ipAlerts"></div>

        </div>



        <!-- BURST -->

        <div class="section">

            <h2>Attack Burst Detection</h2>

            <div id="burstAlerts"></div>

        </div>



        <!-- RISK USERS -->

        <div class="section">

            <h2>Suspicious User Risk Score</h2>

            <table id="riskTable">

                <tr>
                    <th>User</th>
                    <th>Failed Logins</th>
                    <th>Unique IPs</th>
                    <th>Risk</th>
                </tr>

            </table>

        </div>

    </div>



<script>

async function loadTypes() {

    const response = await fetch("/api/stats/types");
    const data = await response.json();

    const table = document.getElementById("typesTable");

    let total = 0;
    let failed = 0;

    data.forEach(item => {

        total += item.count;

        if (item._id === "failed_login") {
            failed = item.count;
        }

        const row = table.insertRow();

        row.insertCell(0).innerText = item._id;
        row.insertCell(1).innerText = item.count;
    });

    document.getElementById("totalEvents").innerText = total;
    document.getElementById("failedLogins").innerText = failed;
}



async function loadUserAlerts() {

    const response = await fetch("/api/alerts/users");
    const data = await response.json();

    const container = document.getElementById("userAlerts");

    data.forEach(alert => {

        const p = document.createElement("p");

        p.className = "alert";

        p.innerText =
            `ALERT: ${alert._id} ima ${alert.count} failed login pokušaja!`;

        container.appendChild(p);
    });
}



async function loadIpAlerts() {

    const response = await fetch("/api/alerts/ip");
    const data = await response.json();

    const container = document.getElementById("ipAlerts");

    data.forEach(alert => {

        const p = document.createElement("p");

        p.className = "alert";

        p.innerText =
            `ALERT: IP ${alert._id} ima ${alert.count} failed login pokušaja!`;

        container.appendChild(p);
    });
}



async function loadBurstAlerts() {

    const response = await fetch("/api/alerts/burst");
    const data = await response.json();

    const container = document.getElementById("burstAlerts");

    data.forEach(alert => {

        const p = document.createElement("p");

        p.className = "alert";

        p.innerText =
            `ATTACK BURST: ${alert.count} failed login pokušaja detektovano u kratkom vremenskom intervalu!`;

        container.appendChild(p);
    });
}



async function loadTrend() {

    const response = await fetch("/api/stats/trend");
    const data = await response.json();

    const table = document.getElementById("trendTable");

    data.forEach(item => {

        const row = table.insertRow();

        row.insertCell(0).innerText =
            new Date(item._id).toLocaleTimeString();

        row.insertCell(1).innerText =
            item.count;
    });
}



async function loadRiskUsers() {

    const response = await fetch("/api/risk/users");
    const data = await response.json();

    const table = document.getElementById("riskTable");

    let highRiskCount = 0;

    data.forEach(user => {

        const row = table.insertRow();

        row.insertCell(0).innerText = user._id;

        row.insertCell(1).innerText =
            user.failed_logins;

        row.insertCell(2).innerText =
            user.ip_count;

        const badgeCell = row.insertCell(3);

        const badge = document.createElement("span");

        badge.classList.add("badge");

        if (user.risk_score >= 10) {

            badge.innerText = "HIGH";
            badge.classList.add("risk-high");
            highRiskCount++;

        } else if (user.risk_score >= 5) {

            badge.innerText = "MEDIUM";
            badge.classList.add("risk-medium");

        } else {

            badge.innerText = "LOW";
            badge.classList.add("risk-low");
        }

        badgeCell.appendChild(badge);
    });

    document.getElementById("highRiskUsers").innerText =
        highRiskCount;
}



loadTypes();
loadUserAlerts();
loadIpAlerts();
loadBurstAlerts();
loadTrend();
loadRiskUsers();

</script>

</body>
</html>
